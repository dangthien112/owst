name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          # Build using the logic from your build.bat
          $iconArg = if (Test-Path "assets\icon.ico") { "--icon assets\icon.ico" } else { "" }
          pyinstaller --noconfirm --clean --onefile --windowed --name Order2PDF $iconArg --add-data "fonts;fonts" --add-data "products.json;." --add-data "config.json;." app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Order2PDF-exe
          path: dist/Order2PDF.exe
